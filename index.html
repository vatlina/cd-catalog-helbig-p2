const SEP = /\s*;\s*/;
const split = s => (s||"").split(SEP).map(x=>x.trim()).filter(x=>x && x!=="—");
const norm = s => (s||"").toLowerCase().replace(/ё/g,"е");

const sel = {g:document.getElementById("fGenre"),c:document.getElementById("fComp"),p:document.getElementById("fPerf")};
function fill(el, vals){
  const sorted=[...new Set(vals)].sort((a,b)=>a.localeCompare(b,"ru"));
  el.innerHTML='<option value="">— все ('+sorted.length+') —</option>'+sorted.map(v=>'<option>'+v.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</option>').join("");
}
fill(sel.g,DATA.flatMap(r=>split(r.genre)));
fill(sel.c,DATA.flatMap(r=>split(r.comp_ru)));
fill(sel.p,DATA.flatMap(r=>split(r.perf_ru)));

const body=document.getElementById("body");
const q=document.getElementById("q");
let shown=[];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");

function hay(r){return norm([r.n,r.title,r.discs,r.origin,r.genre,r.type,r.comp_ru,r.comp_orig,r.perf_ru,r.perf_orig,r.author,r.abook,r.note].join(" | "));}
DATA.forEach(r=>r._h=hay(r));

function render(){
  const g=sel.g.value,c=sel.c.value,p=sel.p.value,t=norm(q.value.trim());
  shown=DATA.filter(r=>(!g||split(r.genre).includes(g))&&(!c||split(r.comp_ru).includes(c))&&(!p||split(r.perf_ru).includes(p))&&(!t||r._h.includes(t)));
  body.innerHTML=shown.map((r,i)=>{
    const th=r.photos.map((f,k)=>'<img loading="lazy" src="'+BASE+f+'" data-i="'+i+'" data-k="'+k+'" alt="'+esc(r.title)+'" title="'+f+'">').join("");
    return '<tr><td class="n">'+String(r.n).padStart(3,"0")+'</td><td><div class="thumbs">'+th+'</div></td>'+
    '<td class="title-col">'+esc(r.title)+'</td><td>'+r.discs+'</td><td>'+esc(r.origin)+'</td><td>'+esc(r.genre)+'</td><td>'+esc(r.type)+'</td>'+
    '<td>'+esc(r.comp_ru)+'</td><td class="small">'+esc(r.comp_orig)+'</td><td>'+esc(r.perf_ru)+'</td><td class="small">'+esc(r.perf_orig)+'</td>'+
    '<td>'+esc(r.author)+'</td><td>'+esc(r.abook)+'</td><td class="small">'+esc(r.note)+'</td></tr>';
  }).join("");
  const nd=shown.reduce((s,r)=>s+r.discs,0);
  document.getElementById("count").textContent="Упаковок: "+shown.length+" из "+DATA.length+" · дисков: "+nd;
  document.getElementById("empty").hidden=shown.length>0;
}
Object.values(sel).forEach(e=>e.addEventListener("change",render));
q.addEventListener("input",render);
document.getElementById("reset").onclick=()=>{Object.values(sel).forEach(e=>e.value="");q.value="";render();};

// Всплывающее окно с фото
const lb=document.getElementById("lb"),lbi=document.getElementById("lbi"),lbc=document.getElementById("lbc");
let ci=0,ck=0;
function openLb(i,k){ci=i;ck=k;const r=shown[i];lbi.src=BASE+r.photos[k];lbc.textContent=String(r.n).padStart(3,"0")+" · "+r.title+" · "+r.photos[k]+" ("+(k+1)+"/"+r.photos.length+")";lb.classList.add("on");}
function step(d){const r=shown[ci];ck=(ck+d+r.photos.length)%r.photos.length;openLb(ci,ck);}
body.addEventListener("click",e=>{const im=e.target.closest("img");if(im)openLb(+im.dataset.i,+im.dataset.k);});
document.getElementById("lbx").onclick=()=>lb.classList.remove("on");
document.getElementById("lbp").onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById("lbn").onclick=e=>{e.stopPropagation();step(1)};
lb.addEventListener("click",e=>{if(e.target===lb)lb.classList.remove("on")});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);});
render();
</script>
